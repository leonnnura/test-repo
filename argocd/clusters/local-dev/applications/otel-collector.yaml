---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: tools

  # Source of the application manifests
  sources:
  - repoURL: https://github.com/Matrics-io/platform-infra.git
    targetRevision: main
    # path: argocd/clusters/hplus-develop-cluster/deployments/otel-collector/resources
    ref: values
    # Open Telemetry
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: 0.122.5
    chart: opentelemetry-collector
    helm:
      valueFiles:
      - $values/argocd/clusters/local-dev/deployments/otel-collector/values.yaml
# 
  destination:
    name: local-dev
    namespace: otel-collector

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    # Sync options which modifies sync behavior
    - PruneLast=true # Allow the ability for resource pruning to happen as a final, implicit wave of a sync operation
    - ApplyOutOfSyncOnly=true # Only sync out-of-sync resources, rather than applying every object in the application
    - CreateNamespace=true
    - FailOnSharedResource=true
    # The retry feature is available since v1.7
    retry:
      limit: 5 # number of failed sync attempt retries; unlimited number of attempts if less than 0
      backoff:
        duration: 5s # the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
        factor: 2 # a factor to multiply the base duration after each failed retry
        maxDuration: 3m # the maximum amount of time allowed for the backoff strategy
  revisionHistoryLimit: 3
