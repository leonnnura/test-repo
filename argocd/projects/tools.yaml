---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tools
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Internal Tools Management
  sourceNamespaces:
  # Namespaces where application of this project can reside in
  - argocd
  - local-dev
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    name: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist: []
  roles: []
